<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>PBD Fluid Simulation with Stable Color Transfer</title>
    <style>
      body {
        background: #090d16;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }
      canvas {
        background: #020617;
        border: 1px solid #1e293b;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        margin-bottom: 12px;
      }
      h2 {
        margin-bottom: 10px;
        font-size: 1.1rem;
        font-weight: 400;
        color: #38bdf8;
      }
      .controls {
        display: flex;
        gap: 10px;
      }
      button {
        background: #38bdf8;
        color: #020617;
        border: none;
        padding: 10px 20px;
        font-size: 0.95rem;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      }
      button:hover {
        background: #7dd3fc;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <h2>PBD法・色の伝播シミュレーション（修正版）</h2>
    <canvas id="simCanvas" width="800" height="800"></canvas>
    <div class="controls">
      <button id="addBtn">赤い粒子を追加する</button>
    </div>

    <script>
      const canvas = document.getElementById("simCanvas")
      const ctx = canvas.getContext("2d")

      const WIDTH = canvas.width
      const HEIGHT = canvas.height

      const REST_DIST = 14.0
      const COLLISION_DIST = 12.0
      const GRAVITY = 0.35

      class Particle {
        constructor(x, y, color) {
          this.x = x
          this.y = y
          this.oldX = x
          this.oldY = y
          this.color = color // [r, g, b, a]
        }
      }

      // 初期配置（全て青）
      const num = 6
      let particles = []
      for (let x = WIDTH * 0.4; x < WIDTH * 0.6; x += num) {
        for (let y = HEIGHT * 0.05; y < HEIGHT * 0.45; y += num) {
          particles.push(
            new Particle(x + (Math.random() - 0.5) * 2, y, [56, 189, 248, 0.7]),
          )
        }
      }

      // ボタンクリックで追加する粒子の初期配置（赤）
      const num_add = 14
      function addParticles() {
        for (let x = WIDTH * 0.44; x < WIDTH * 0.56; x += num_add) {
          for (let y = HEIGHT * 0.02; y < HEIGHT * 0.12; y += num_add) {
            particles.push(
              new Particle(
                x + (Math.random() - 0.5) * 2,
                y,
                [239, 68, 68, 0.7],
              ),
            )
          }
        }
      }

      document.getElementById("addBtn").addEventListener("click", addParticles)

      function update() {
        const n = particles.length

        // 1. 物理演算（位置更新）
        for (let p of particles) {
          let vx = (p.x - p.oldX) * 0.98
          let vy = (p.y - p.oldY) * 0.98 + GRAVITY

          p.oldX = p.x
          p.oldY = p.y

          p.x += vx
          p.y += vy
        }

        // 2. 距離制約（非圧縮性・位置の押し返しのみ）
        for (let iter = 0; iter < 6; iter++) {
          for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
              let p1 = particles[i]
              let p2 = particles[j]

              let dx = p2.x - p1.x
              let dy = p2.y - p1.y
              let dist = Math.sqrt(dx * dx + dy * dy)

              if (dist < COLLISION_DIST && dist > 0) {
                let correction = ((COLLISION_DIST - dist) / dist) * 0.7
                let offsetX = dx * correction * 0.5
                let offsetY = dy * correction * 0.5

                p1.x -= offsetX
                p1.y -= offsetY
                p2.x += offsetX
                p2.y += offsetY
              }
            }
          }
        }

        // 3. 色の伝播（物理演算が終わったあとに、1フレームに1回だけ安全にブレンドする）
        let newColors = particles.map((p) => [
          p.color[0],
          p.color[1],
          p.color[2],
        ])

        for (let i = 0; i < n; i++) {
          for (let j = i + 1; j < n; j++) {
            let p1 = particles[i]
            let p2 = particles[j]

            let dx = p2.x - p1.x
            let dy = p2.y - p1.y
            let dist = Math.sqrt(dx * dx + dy * dy)

            // 近くにいる粒子同士で色をなめらかに混ぜ合わせる
            if (dist < COLLISION_DIST * 1.3) {
              const blendRate = 0.03 // 色が移るスピード（小さくするとより滑らか）
              for (let c = 0; c < 3; c++) {
                let diff = p2.color[c] - p1.color[c]
                newColors[i][c] += diff * blendRate
                newColors[j][c] -= diff * blendRate
              }
            }
          }
        }

        // 計算された色を反映し、範囲内にクランプする
        for (let i = 0; i < n; i++) {
          particles[i].color[0] = Math.max(0, Math.min(255, newColors[i][0]))
          particles[i].color[1] = Math.max(0, Math.min(255, newColors[i][1]))
          particles[i].color[2] = Math.max(0, Math.min(255, newColors[i][2]))
        }

        // 4. 境界条件（壁と床）
        const margin = 10
        for (let p of particles) {
          if (p.x < margin) {
            p.x = margin
            let vx = (p.x - p.oldX) * 0.8
            p.oldX = p.x - vx
          }
          if (p.x > WIDTH - margin) {
            p.x = WIDTH - margin
            let vx = (p.x - p.oldX) * 0.8
            p.oldX = p.x - vx
          }
          if (p.y < margin) {
            p.y = margin
          }

          if (p.y > HEIGHT - margin) {
            p.y = HEIGHT - margin
            p.oldX = p.x
            p.oldY = p.y + (p.y - p.oldY) * 0.1
          }
        }
      }

      function loop() {
        update()

        ctx.fillStyle = "#020617"
        ctx.fillRect(0, 0, WIDTH, HEIGHT)

        for (let p of particles) {
          ctx.beginPath()
          ctx.fillStyle = `rgba(${Math.round(p.color[0])}, ${Math.round(p.color[1])}, ${Math.round(p.color[2])}, ${p.color[3]})`
          ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2)
          ctx.fill()
        }

        requestAnimationFrame(loop)
      }

      requestAnimationFrame(loop)
    </script>
  </body>
</html>
