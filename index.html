<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Stable PBD Fluid Simulation</title>
    <style>
      body {
        background: #090d16;
        color: #f8fafc;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: sans-serif;
      }
      canvas {
        background: #020617;
        border: 1px solid #1e293b;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
        border-radius: 8px;
        margin-bottom: 12px;
      }
      h2 {
        margin-bottom: 10px;
        font-size: 1.1rem;
        font-weight: 400;
        color: #38bdf8;
      }
      .controls {
        display: flex;
        gap: 10px;
      }
      button {
        background: #38bdf8;
        color: #020617;
        border: none;
        padding: 10px 20px;
        font-size: 0.95rem;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
      }
      button:hover {
        background: #7dd3fc;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <h2>PBD法・絶対に爆発しない安定版水たまり</h2>
    <canvas id="simCanvas" width="800" height="800"></canvas>
    <div class="controls">
      <button id="addBtn">上から粒子を追加する</button>
    </div>

    <script>
      const canvas = document.getElementById("simCanvas")
      const ctx = canvas.getContext("2d")

      const WIDTH = canvas.width
      const HEIGHT = canvas.height

      const REST_DIST = 14.0 // 粒子の基準間隔（少し広げて重なりにくくする）
      const COLLISION_DIST = 12.0 // 最小距離（ここより近づくと反発）
      const GRAVITY = 0.35 // 重力（少し強めにして早く落とす）

      class Particle {
        constructor(x, y) {
          this.x = x
          this.y = y
          this.oldX = x
          this.oldY = y
        }
      }

      // 初期配置（密度を少し低くして初期の重なりを減らす）
      const num = 10
      let particles = []
      for (let x = WIDTH * 0.4; x < WIDTH * 0.6; x += num) {
        for (let y = HEIGHT * 0.05; y < HEIGHT * 0.45; y += num) {
          particles.push(new Particle(x + (Math.random() - 0.5) * 2, y))
        }
      }

      // ボタンクリックで追加する粒子の初期配置
      const num_add = 8
      function addParticles() {
        for (let x = WIDTH * 0.44; x < WIDTH * 0.56; x += num_add) {
          for (let y = HEIGHT * 0.02; y < HEIGHT * 0.12; y += num_add) {
            particles.push(new Particle(x + (Math.random() - 0.5) * 2, y))
          }
        }
      }

      document.getElementById("addBtn").addEventListener("click", addParticles)

      function update() {
        const n = particles.length

        // 1. 予測位置の更新（空気抵抗を少し強めに入れる）
        for (let p of particles) {
          let vx = (p.x - p.oldX) * 0.98 // 水平方向の減衰
          let vy = (p.y - p.oldY) * 0.98 + GRAVITY // 垂直方向の減衰＋重力

          p.oldX = p.x
          p.oldY = p.y

          p.x += vx
          p.y += vy
        }

        // 2. 距離制約（非圧縮性のための押し返し）。反復回数を増やして収束を速める
        for (let iter = 0; iter < 6; iter++) {
          // 4回 → 6回に増やした
          for (let i = 0; i < n; i++) {
            for (let j = i + 1; j < n; j++) {
              let p1 = particles[i]
              let p2 = particles[j]

              let dx = p2.x - p1.x
              let dy = p2.y - p1.y
              let dist = Math.sqrt(dx * dx + dy * dy)

              // 粒子が重なっている場合のみ強制的に押し戻す（反発のみ）
              if (dist < COLLISION_DIST && dist > 0) {
                let correction = ((COLLISION_DIST - dist) / dist) * 0.7 // 係数を上げて強く押し戻す

                let offsetX = dx * correction * 0.5
                let offsetY = dy * correction * 0.5

                p1.x -= offsetX
                p1.y -= offsetY
                p2.x += offsetX
                p2.y += offsetY
              }
            }
          }
        }

        // 3. 境界条件（壁と床。床での摩擦とエネルギーロスを徹底する）
        const margin = 10
        for (let p of particles) {
          // 左右の壁（少しだけ跳ねる）
          if (p.x < margin) {
            p.x = margin
            let vx = (p.x - p.oldX) * 0.8
            p.oldX = p.x - vx
          }
          if (p.x > WIDTH - margin) {
            p.x = WIDTH - margin
            let vx = (p.x - p.oldX) * 0.8
            p.oldX = p.x - vx
          }
          // 天井
          if (p.y < margin) {
            p.y = margin
          }

          // 床（ここが最重要）
          if (p.y > HEIGHT - margin) {
            p.y = HEIGHT - margin
            // 床にぶつかったら、横方向の勢いは「ほぼゼロ」にする（強力な摩擦）
            // 縦方向の跳ね返りも「ゼロ」にする（完全な非弾性衝突）
            p.oldX = p.x // 横方向の移動量をリセット
            p.oldY = p.y + (p.y - p.oldY) * 0.1 // 縦方向の反発を吸収
          }
        }
      }

      function loop() {
        update()

        ctx.fillStyle = "#020617"
        ctx.fillRect(0, 0, WIDTH, HEIGHT)

        // 粒子の描画（重なりをごまかすため、サイズを少し小さく）
        ctx.fillStyle = "rgba(56, 189, 248, 0.7)"
        for (let p of particles) {
          ctx.beginPath()
          ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2) // 8.0 → 6.5に小さくした
          ctx.fill()
        }

        requestAnimationFrame(loop)
      }

      requestAnimationFrame(loop)
    </script>
  </body>
</html>
